# Keeps one release PR open while changesets are pending. Runs on every
# push to main and regenerates the release branch from main.
name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit that added a changeset gives its changelog line the PR and author
      - uses: livekit/verwalter@359985c1e5567b17ae84db0241fbb305c383f89e # v0.30.0
        with:
          command: pr
          # A GitHub App token lets the release PR start CI. The default
          # github.token does not. Without these secrets, github.token is used.
          app-client-id: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}
